name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: fraud_risk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m ruff check .
      - run: python run.py demo --rows 12000 --trees 12 --sql-backend duckdb --output-dir reports/ci-demo --tuning-trials 1 --bootstrap-iterations 40
      - run: python run.py demo --rows 12000 --trees 12 --output-dir reports/ci-mysql --tuning-trials 1 --bootstrap-iterations 40
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_test_password
          MYSQL_DATABASE: fraud_risk
      - run: python -m pytest -q
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ci_test_password
          MYSQL_DATABASE: fraud_risk

